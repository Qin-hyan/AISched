<style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        
        /* Transitions */
        .transition-all-300 {
            transition: all 0.3s ease;
        }

        /* Timeline specific styles */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            min-width: 1200px;
        }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideIn 0.3s forwards;
        }
    </style>

<script>
        // --- Data & Constants ---
        const CATEGORIES = {
            work: { label: '工作', color: 'bg-blue-100 text-blue-800 border-blue-200 dark:bg-blue-900/30 dark:text-blue-300 dark:border-blue-800' },
            life: { label: '生活', color: 'bg-green-100 text-green-800 border-green-200 dark:bg-green-900/30 dark:text-green-300 dark:border-green-800' },
            personal: { label: '个人', color: 'bg-purple-100 text-purple-800 border-purple-200 dark:bg-purple-900/30 dark:text-purple-300 dark:border-purple-800' },
            health: { label: '健康', color: 'bg-red-100 text-red-800 border-red-200 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800' }
        };

        const HOLIDAYS_2026 = {
            '2026-01-01': '元旦',
            '2026-02-17': '除夕',
            '2026-02-18': '春节',
            '2026-02-19': '春节',
            '2026-02-20': '春节',
            '2026-04-04': '清明节',
            '2026-05-01': '劳动节',
            '2026-06-19': '端午节',
            '2026-09-25': '中秋节',
            '2026-10-01': '国庆节'
        };

        // --- Store Class ---
        class Store {
            constructor() {
                this.events = JSON.parse(localStorage.getItem('smartSchedule_events')) || [];
                this.settings = JSON.parse(localStorage.getItem('smartSchedule_settings')) || { theme: 'light' };
            }

            save() {
                localStorage.setItem('smartSchedule_events', JSON.stringify(this.events));
                localStorage.setItem('smartSchedule_settings', JSON.stringify(this.settings));
            }

            addEvent(event) {
                this.events.push(event);
                this.save();
            }

            updateEvent(updatedEvent) {
                const index = this.events.findIndex(e => e.id === updatedEvent.id);
                if (index !== -1) {
                    this.events[index] = updatedEvent;
                    this.save();
                }
            }

            deleteEvent(id) {
                this.events = this.events.filter(e => e.id !== id);
                this.save();
            }

            getEvents(dateRangeStart, dateRangeEnd) {
                return this.events.filter(e => {
                    const start = new Date(e.start);
                    return start >= dateRangeStart && start <= dateRangeEnd;
                });
            }
            
            // Get holidays for a specific date string (YYYY-MM-DD)
            getHoliday(dateStr) {
                return HOLIDAYS_2026[dateStr] || null;
            }
        }

        // --- Main Application Logic ---
        class App {
            constructor() {
                this.store = new Store();
                this.currentDate = new Date('2026-03-11T00:00:00'); // Default from prompt
                this.currentView = 'month';
                this.selectedEventId = null;
                
                this.init();
            }

            init() {
                this.applyTheme();
                this.setupEventListeners();
                this.renderCategoryFilters();
                this.render();
                this.startReminderChecker();
            }

            applyTheme() {
                const isDark = this.store.settings.theme === 'dark';
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-toggle-desktop').innerHTML = '<i class="fa-solid fa-sun"></i>';
                    document.getElementById('theme-toggle-mobile').innerHTML = '<i class="fa-solid fa-sun"></i>';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-toggle-desktop').innerHTML = '<i class="fa-solid fa-moon"></i>';
                    document.getElementById('theme-toggle-mobile').innerHTML = '<i class="fa-solid fa-moon"></i>';
                }
            }

            toggleTheme() {
                this.store.settings.theme = this.store.settings.theme === 'light' ? 'dark' : 'light';
                this.store.save();
                this.applyTheme();
            }

            setupEventListeners() {
                document.getElementById('theme-toggle-desktop').addEventListener('click', () => this.toggleTheme());
                document.getElementById('theme-toggle-mobile').addEventListener('click', () => this.toggleTheme());
                document.getElementById('smart-schedule-btn').addEventListener('click', () => this.runSmartSchedule());
            }

            renderCategoryFilters() {
                const container = document.getElementById('category-filters');
                container.innerHTML = '';
                Object.keys(CATEGORIES).forEach(key => {
                    const cat = CATEGORIES[key];
                    const btn = document.createElement('button');
                    btn.className = 'w-full flex items-center gap-2 px-3 py-1.5 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors';
                    btn.innerHTML = `<span class="w-2 h-2 rounded-full ${cat.color.split(' ')[0]}"></span>${cat.label}`;
                    btn.onclick = () => this.filterByCategory(key);
                    container.appendChild(btn);
                });
            }

            filterByCategory(category) {
                // Simplified filter: Just show a toast for now, real filtering would update the view logic
                this.showToast(`已筛选分类: ${CATEGORIES[category].label}`, 'info');
                // In a full implementation, this would set a state `this.filterCategory = category` and re-render
            }

            // --- Navigation ---
            navigateDate(delta) {
                if (this.currentView === 'month') {
                    this.currentDate.setMonth(this.currentDate.getMonth() + delta);
                } else if (this.currentView === 'week') {
                    this.currentDate.setDate(this.currentDate.getDate() + (delta * 7));
                } else {
                    this.currentDate.setDate(this.currentDate.getDate() + delta);
                }
                this.render();
            }

            resetToToday() {
                this.currentDate = new Date('2026-03-11T00:00:00'); // Keeping consistent with prompt context
                this.render();
            }

            switchView(viewName) {
                this.currentView = viewName;
                document.querySelectorAll('.view-btn').forEach(btn => {
                    if (btn.dataset.view === viewName) {
                        btn.classList.add('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30', 'dark:text-blue-400');
                        btn.querySelector('i').classList.add('text-blue-500');
                    } else {
                        btn.classList.remove('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30', 'dark:text-blue-400');
                        btn.querySelector('i').classList.remove('text-blue-500');
                    }
                });
                this.render();
            }

            // --- Rendering ---
            render() {
                this.updateDateDisplay();
                const container = document.getElementById('view-container');
                container.innerHTML = '';

                switch (this.currentView) {
                    case 'month': this.renderMonthView(container); break;
                    case 'week': this.renderWeekView(container); break;
                    case 'day': this.renderDayView(container); break;
                    case 'agenda': this.renderAgendaView(container); break;
                    case 'timeline': this.renderTimelineView(container); break;
                }
            }

            // --- Modal & Form Logic ---
            openEventModal(eventId = null, dateHint = null) {
                const modal = document.getElementById('event-modal');
                const form = document.getElementById('event-form');
                const deleteBtn = document.getElementById('btn-delete-event');
                
                form.reset();
                document.querySelectorAll('.reminder-check').forEach(cb => cb.checked = false);

                if (eventId) {
                    const evt = this.store.events.find(e => e.id === eventId);
                    this.selectedEventId = eventId;
                    document.getElementById('modal-title').textContent = '编辑日程';
                    document.getElementById('event-id').value = evt.id;
                    document.getElementById('event-title').value = evt.title;
                    document.getElementById('event-start').value = evt.start.substring(0, 16);
                    document.getElementById('event-end').value = evt.end.substring(0, 16);
                    document.getElementById('event-category').value = evt.category;
                    document.getElementById('event-priority').value = evt.priority;
                    document.getElementById('event-location').value = evt.location || '';
                    document.getElementById('event-location-alert').checked = !!evt.locationAlert;
                    document.getElementById('event-notes').value = evt.notes || '';
                    
                    if (evt.reminders) {
                        evt.reminders.forEach(r => {
                            const cb = document.querySelector(`.reminder-check[value="${r}"]`);
                            if (cb) cb.checked = true;
                        });
                    }
                    deleteBtn.classList.remove('hidden');
                } else {
                    this.selectedEventId = null;
                    document.getElementById('modal-title').textContent = '新建日程';
                    deleteBtn.classList.add('hidden');
                    
                    if (dateHint) {
                        const iso = dateHint.toISOString();
                        document.getElementById('event-start').value = iso.substring(0, 16);
                        // Default 1 hour duration
                        const end = new Date(dateHint.getTime() + 60*60*1000);
                        document.getElementById('event-end').value = end.toISOString().substring(0, 16);
                    }
                }

                modal.classList.remove('hidden');
            }

            closeEventModal() {
                document.getElementById('event-modal').classList.add('hidden');
            }

            saveEvent() {
                const title = document.getElementById('event-title').value;
                const start = document.getElementById('event-start').value;
                const end = document.getElementById('event-end').value;
                
                if (!title || !start || !end) {
                    this.showToast('请填写完整信息', 'error');
                    return;
                }
                if (new Date(start) >= new Date(end)) {
                    this.showToast('结束时间必须晚于开始时间', 'error');
                    return;
                }

                const reminders = [];
                document.querySelectorAll('.reminder-check:checked').forEach(cb => reminders.push(parseInt(cb.value)));

                const eventData = {
                    id: this.selectedEventId || Date.now().toString(),
                    title,
                    start: new Date(start).toISOString(),
                    end: new Date(end).toISOString(),
                    category: document.getElementById('event-category').value,
                    priority: parseInt(document.getElementById('event-priority').value),
                    location: document.getElementById('event-location').value,
                    locationAlert: document.getElementById('event-location-alert').checked,
                    notes: document.getElementById('event-notes').value,
                    reminders
                };

                if (this.selectedEventId) {
                    this.store.updateEvent(eventData);
                    this.showToast('日程已更新');
                } else {
                    this.store.addEvent(eventData);
                    this.showToast('日程已创建');
                }

                this.closeEventModal();
                this.render();
            }

            deleteEvent() {
                if (this.selectedEventId) {
                    this.store.deleteEvent(this.selectedEventId);
                    this.showToast('日程已删除');
                    this.closeEventModal();
                    this.render();
                }
            }

            // --- Clipboard Import (New) ---
            async importFromClipboard() {
                try {
                    const text = await navigator.clipboard.readText();
                    this.showToast('正在解析剪贴板内容...', 'info');
                    
                    // Simple Regex Parsing
                    // Time patterns: "14:00", "下午2点", "2pm"
                    const timeRegex = /(\d{1,2})[:点](\d{0,2})/;
                    const match = text.match(timeRegex);
                    
                    if (match) {
                        let hour = parseInt(match[1]);
                        const minute = match[2] ? parseInt(match[2]) : 0;
                        if (text.includes('下午') && hour < 12) hour += 12;
                        
                        // Set time to today or next appropriate slot
                        const date = new Date(this.currentDate);
                        date.setHours(hour, minute, 0, 0);
                        
                        document.getElementById('event-start').value = date.toISOString().substring(0, 16);
                        const end = new Date(date.getTime() + 60*60*1000);
                        document.getElementById('event-end').value = end.toISOString().substring(0, 16);
                        
                        // Try to find location keywords
                        if (text.includes('在')) {
                            const locParts = text.split('在');
                            if (locParts.length > 1) {
                                const loc = locParts[1].split(' ')[0].split('，')[0].split('。')[0];
                                document.getElementById('event-location').value = loc;
                            }
                        }
                        
                        // Title (remove time and location)
                        let title = text.replace(timeRegex, '').replace(/在.*/, '').trim();
                        if (title.length < 2) title = '未命名事件';
                        document.getElementById('event-title').value = title;
                        
                        this.showToast('已自动识别并填充表单', 'success');
                    } else {
                        this.showToast('未能识别时间信息，已填充标题', 'warning');
                        document.getElementById('event-title').value = text.substring(0, 20);
                    }
                } catch (err) {
                    console.error(err);
                    this.showToast('无法读取剪贴板，请检查权限', 'error');
                }
            }

            // --- Smart Schedule (AI Algorithm) ---
            runSmartSchedule() {
                this.showToast('正在智能分析空闲时间...', 'info');
                
                // Get events for the current selected day
                const startOfDay = new Date(this.currentDate);
                startOfDay.setHours(8, 0, 0, 0); // Start work day at 8 AM
                
                const endOfDay = new Date(this.currentDate);
                endOfDay.setHours(20, 0, 0, 0); // End work day at 8 PM
                
                let dayEvents = this.store.getEvents(
                    new Date(this.currentDate.setHours(0,0,0,0)),
                    new Date(this.currentDate.setHours(23,59,59,999))
                );

                if (dayEvents.length === 0) {
                    this.showToast('今日无日程可安排', 'info');
                    return;
                }

                // 1. Sort by Priority (High to Low)
                dayEvents.sort((a, b) => b.priority - a.priority);

                // 2. Greedy placement
                let currentTime = new Date(startOfDay);
                let movedCount = 0;

                dayEvents.forEach(evt => {
                    const duration = new Date(evt.end) - new Date(evt.start);
                    const newStart = new Date(currentTime);
                    const newEnd = new Date(currentTime.getTime() + duration);
                    
                    // Check if event needs moving (allow some buffer for fixed events logic if we had that flag)
                    // For now, we compact everything.
                    
                    evt.start = newStart.toISOString();
                    evt.end = newEnd.toISOString();
                    
                    this.store.updateEvent(evt);
                    
                    // Move current time forward + 15 min buffer
                    currentTime = new Date(newEnd.getTime() + 15*60000);
                    movedCount++;
                });

                this.render();
                this.showToast(`智能排程完成，已优化 ${movedCount} 个任务`, 'success');
            }

                const quadrants = {
                    q1: { title: '重要且紧急', desc: '立即去做', events: [] },
                    q2: { title: '重要不紧急', desc: '制定计划', events: [] },
                    q3: { title: '不重要但紧急', desc: '授权/委托', events: [] },
                    q4: { title: '不重要不紧急', desc: '尽量少做', events: [] }
                };

                events.forEach(evt => {
                    if (evt.priority >= 4) quadrants.q1.events.push(evt);
                    else if (evt.priority === 3) quadrants.q2.events.push(evt);
                    else if (evt.priority === 2) quadrants.q3.events.push(evt);
                    else quadrants.q4.events.push(evt);
                });

                content.innerHTML = '';
                Object.values(quadrants).forEach(q => {
                    const div = document.createElement('div');
                    div.className = 'bg-gray-50 dark:bg-gray-700/50 p-4 rounded-lg border border-gray-200 dark:border-gray-600 flex flex-col';
                    div.innerHTML = `
                        <h4 class="font-bold text-gray-800 dark:text-gray-200 mb-1">${q.title}</h4>
                        <p class="text-xs text-gray-500 mb-3">${q.desc}</p>
                        <div class="space-y-2 overflow-y-auto flex-1">
                            ${q.events.map(e => `
                                <div class="bg-white dark:bg-gray-800 p-2 rounded shadow-sm text-xs border-l-2 ${CATEGORIES[e.category]?.color.split(' ')[0] || 'bg-gray-200'}">
                                    ${e.title}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    content.appendChild(div);
                });
            }

            closeMatrixModal() {
                document.getElementById('matrix-modal').classList.add('hidden');
            }

            // --- Notification System ---
            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                let colors = 'bg-white text-gray-800 border-gray-200';
                let icon = '<i class="fa-solid fa-check-circle text-green-500"></i>';
                
                if (type === 'error') {
                    icon = '<i class="fa-solid fa-circle-exclamation text-red-500"></i>';
                } else if (type === 'info') {
                    icon = '<i class="fa-solid fa-circle-info text-blue-500"></i>';
                }

                toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border ${colors} dark:bg-gray-800 dark:text-gray-100 dark:border-gray-700 min-w-[300px]`;
                toast.innerHTML = `${icon} <span class="text-sm font-medium">${message}</span>`;
                
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-20px)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // --- Reminder Checker ---
            startReminderChecker() {
                setInterval(() => {
                    const now = new Date();
                    this.store.events.forEach(evt => {
                        if (!evt.reminders) return;
                        
                        const start = new Date(evt.start);
                        const diffMin = Math.floor((start - now) / 60000);
                        
                        // Check if any reminder matches current diff (within 1 minute window)
                        if (evt.reminders.includes(diffMin)) {
                            // Simple debounce check using localStorage flag could be added here
                            // For now, just trigger
                            this.showToast(`🔔 提醒: ${evt.title} 将在 ${diffMin === 0 ? '现在' : diffMin + '分钟'} 开始`, 'info');
                            
                            // Remove this specific reminder trigger to avoid spam
                            evt.reminders = evt.reminders.filter(r => r !== diffMin);
                            this.store.updateEvent(evt);
                        }
                    });
                    
                    // Location Check Simulation (Mock)
                    // In a real app, we would use navigator.geolocation.watchPosition
                    // Here we just check if any event has locationAlert enabled and is starting soon
                    this.store.events.forEach(evt => {
                        if (evt.locationAlert && evt.location) {
                            const start = new Date(evt.start);
                            const diffMin = Math.floor((start - now) / 60000);
                            if (diffMin === 30) {
                                this.showToast(`📍 地点提醒: 您即将前往 "${evt.location}"`, 'info');
                            }
                        }
                    });

                }, 60000); // Check every minute
            }
        }

        // Initialize App
        const app = new App();

    </script>
</body>
